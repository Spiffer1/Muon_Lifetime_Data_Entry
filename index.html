<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Muon Lifetime Analyzer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
    }
    #controls {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input, button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #555;
    }
    button {
      background-color: #007acc;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #005999;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="folderInput"><b>Subfolder in images/:</b></label>
    <input type="text" id="folderInput" placeholder="e.g. run1 or batch_01" value="run1">
    <button id="loadBtn">Fetch Images from GitHub</button>
  </div>

  <script src="Muon_Lifetime_Data_Entry.js"></script>
</body>
</html>
